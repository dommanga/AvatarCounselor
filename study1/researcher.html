<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>연구자 화면</title>
  <style>
    :root {
      --bg: #f7f8fa; --surface: #ffffff; --border: #e5e7eb;
      --text: #111827; --muted: #4b5563;
      --accent: #0f766e; --accent-weak: #ccfbf1; --live: #dc2626; --radius: 10px;
      --warn-bg: #fef3c7; --warn-border: #f59e0b; --warn-text: #78350f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; color: var(--text); background: var(--bg); line-height: 1.5; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .err { color: var(--live); }
    .hidden { display: none !important; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 18px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    input[type=text], input[type=password], select { font: inherit; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
    .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; margin-bottom: 14px; }
    .check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 15px; margin: 0; cursor: pointer; }
    button { font: inherit; font-weight: 600; cursor: pointer; padding: 10px 18px; min-height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.small { padding: 6px 12px; min-height: 36px; font-size: 13px; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .note { padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 14px; background: #f3f4f6; }
    .note.warn { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text); }
    .tablewrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; }
    .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: #f3f4f6; }
    .tag.test { background: var(--warn-bg); color: var(--warn-text); }
    .seq { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .blk { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
    .blk .bh { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .slot.used { color: var(--muted); text-decoration: line-through; }
    .slot.next { font-weight: 700; color: var(--accent); }
    details summary { cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- login -->
    <section id="r-login" class="hidden">
      <div class="card" style="max-width: 380px">
        <h2>연구자 로그인</h2>
        <form id="r-loginForm">
          <div class="row">
            <div><label for="r-password">비밀번호</label><input id="r-password" type="password" autocomplete="current-password" required /></div>
            <button class="primary" type="submit">로그인</button>
          </div>
          <div class="err" id="r-loginErr"></div>
        </form>
      </div>
    </section>

    <!-- main -->
    <section id="r-main" class="hidden">
      <div class="top">
        <h1>연구자 화면</h1>
        <div><button class="small" id="r-refresh">새로고침</button> <button class="small" id="r-logout">로그아웃</button></div>
      </div>

      <div class="card">
        <h2>새 세션</h2>
        <div class="note" id="r-nextNote"></div>
        <form id="r-createForm">
          <div class="row">
            <div><label for="r-pid">참가자 ID</label><input id="r-pid" type="text" placeholder="예: P07" autocomplete="off" required /></div>
            <div><label for="r-condition">조건</label>
              <select id="r-condition">
                <option value="reversing">reversing</option>
                <option value="minimizing">minimizing</option>
                <option value="direct">direct</option>
              </select>
            </div>
            <label class="check"><input type="checkbox" id="r-isTest" /> 테스트 세션 (리허설)</label>
          </div>
          <div class="note warn hidden" id="r-createWarn"></div>
          <div class="row">
            <button class="primary" type="submit" id="r-create">세션 생성 후 참가자 화면으로 전환</button>
          </div>
          <div class="err" id="r-createErr"></div>
        </form>
      </div>

      <div class="card">
        <h2>세션 목록</h2>
        <div class="tablewrap">
          <table>
            <thead><tr><th>참가자</th><th>조건</th><th>순번</th><th>단계</th><th>생성</th><th></th></tr></thead>
            <tbody id="r-sessions"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <details>
          <summary>블록 시퀀스 (3명 1블록 × 10)</summary>
          <div class="seq" id="r-seq" style="margin-top: 12px"></div>
        </details>
      </div>
    </section>
  </div>
  <script type="module" src="/src/researcher.js"></script>
</body>
</html>
